name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx astro sync
      - run: npx astro check
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

  db-tests:
    # pgTAP policy suite against a real local Postgres. Separate job: `supabase start`
    # pulls Docker images (~1-2 min) and the Docker-free `ci` job must not pay that cost.
    # PR-only — a red run here is meant to block the merge button (add `db-tests` to
    # master's required status checks in repo Settings → Branches).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v3
        with:
          version: 2.23.4
      - run: supabase start
      - run: supabase test db
      - if: always()
        run: supabase stop
