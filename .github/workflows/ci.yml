name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# The least any job here needs — none of the three writes to the repo. Without this block
# `GITHUB_TOKEN` inherits the repository default (read/write on `contents` for older repos),
# and `npm ci` runs lifecycle scripts from the PR's own `package.json`. Harmless while the
# repo is private; it matters the moment it goes public.
permissions:
  contents: read

# A new push to the same PR cancels the previous run. Without it two `e2e` and two `db-tests`
# jobs hold a Supabase stack each in parallel, and the older result is already stale anyway.
# `master` falls under this too, but pushes there are rare.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx astro sync
      - run: npx astro check
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

  db-tests:
    # pgTAP policy suite against a real local Postgres. Separate job: `supabase start`
    # pulls Docker images (~1-2 min) and the Docker-free `ci` job must not pay that cost.
    # PR-only, and a required status check on master (alongside `ci` and `e2e`) with
    # enforce_admins on, so a red run blocks the merge button for everyone. Note the
    # consequence: this job never runs on `push`, so a commit pushed straight to master can
    # never satisfy it. That is intended — every change goes through a pull request.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # This job writes nothing to the repo; without this, checkout leaves GITHUB_TOKEN
          # behind in .git/config.
          persist-credentials: false
      # Pin raised from 2.23.4: this job is PR-only and the repo had no pull request until now,
      # so the pin had never actually executed. 2.23.4 cannot parse the current
      # `supabase/config.toml` (it rejects `db.migrations.enabled`, `storage.analytics`,
      # `auth.web3`, `auth.oauth_server` among others) and dies on `supabase start`. Keep this
      # version in lockstep with the `e2e` job — both read the same config — and keep the
      # `supabase` devDependency floor in package.json aligned, since `npm run db:test` runs
      # against that one locally.
      - uses: supabase/setup-cli@v3
        with:
          version: 2.117.0
      - run: supabase start
      - run: supabase test db
      - if: always()
        run: supabase stop

  e2e:
    # Smoke gate on the main user path (`login → deck → review`),
    # `tests/e2e/critical-loop.spec.ts`. A separate job rather than steps bolted onto
    # `db-tests`: a pgTAP failure would mask the e2e result and a red job would stop naming
    # the broken layer.
    # PR-only, and a required status check on master (alongside `ci` and `db-tests`) with
    # enforce_admins on, so a red run blocks the merge button for everyone. Same consequence as
    # db-tests: it never runs on `push`, so every change to master goes through a pull request.
    #
    # Note the scope: `npm run test:e2e` runs the WHOLE `tests/e2e/` directory, not just the
    # loop spec. `auth.setup.ts`, `seed.spec.ts` and `protected-routes.guest.spec.ts` are part
    # of the gate — deliberately, but it means `seed.spec.ts` (kept as a teaching example) now
    # carries production weight and has to be maintained accordingly.
    #
    # The second clause of the condition excludes fork PRs. The trigger is `pull_request` (not
    # `pull_request_target`, which would run fork code with access to secrets), so a fork gets
    # no secrets — the `E2E_USERNAME`/`E2E_PASSWORD` guards below would then fail and hand an
    # outside contributor a red gate they cannot fix. Better to skip the job than to fail it
    # for a reason that has nothing to do with the change.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # A green run takes ~5 min (see job history). 20 min leaves room for a slow image pull
    # while still capping a wedged job (Docker + dev server + browser), which would otherwise
    # burn the runner's 6-hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # This job writes nothing to the repo; without this, checkout leaves GITHUB_TOKEN
          # behind in .git/config.
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx astro sync

      # Same version as `db-tests` — both jobs read the same `supabase/config.toml`, so a pin
      # mismatch would mean one of them dies parsing the config.
      - uses: supabase/setup-cli@v3
        with:
          version: 2.117.0
      - run: supabase start

      # A step that fails loudly and under its own name when the stack did not come up —
      # otherwise missing keys would surface much later, as "login failed" in the Playwright
      # report. `-o env --override-name` is the documented machine-readable form
      # (`supabase status --help`).
      - name: Capture local Supabase URL and anon key
        run: |
          set -euo pipefail
          status="$(supabase status -o env \
            --override-name api.url=SUPABASE_URL \
            --override-name auth.anon_key=SUPABASE_KEY)"
          eval "$status"
          test -n "${SUPABASE_URL:-}" || { echo "::error::SUPABASE_URL is empty — the Supabase stack did not start correctly."; exit 1; }
          test -n "${SUPABASE_KEY:-}" || { echo "::error::SUPABASE_KEY is empty — the Supabase stack did not start correctly."; exit 1; }
          echo "::add-mask::$SUPABASE_KEY"
          echo "SUPABASE_URL=$SUPABASE_URL" >> "$GITHUB_ENV"
          echo "SUPABASE_KEY=$SUPABASE_KEY" >> "$GITHUB_ENV"

      # The test account is created straight in GoTrue — no running app required.
      # `supabase/config.toml:209` sets `enable_confirmations = false`, so the account can sign
      # in immediately without a hand-written bcrypt hash. `--fail` turns a non-2xx into a red
      # THIS step, rather than a login failure three steps later.
      - name: Create the test account in local GoTrue
        env:
          E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${E2E_USERNAME:-}" || { echo "::error::Repository secret E2E_USERNAME is missing."; exit 1; }
          test -n "${E2E_PASSWORD:-}" || { echo "::error::Repository secret E2E_PASSWORD is missing."; exit 1; }
          # jq builds the JSON, so special characters in the secrets cannot break the body.
          payload="$(jq -n --arg email "$E2E_USERNAME" --arg password "$E2E_PASSWORD" \
            '{email: $email, password: $password}')"
          curl --fail --silent --show-error --output /dev/null \
            -X POST "$SUPABASE_URL/auth/v1/signup" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d "$payload"

      # Chromium only — `playwright.config.ts` configures no other browser.
      - run: npx playwright install --with-deps chromium

      # Playwright's own `webServer` block starts `astro dev`; in dev, `astro:env` secrets
      # resolve through `process.env`, so the job env (SUPABASE_URL / SUPABASE_KEY from
      # $GITHUB_ENV) reaches the app. Locally `.dev.vars` wins instead — gitignored and absent
      # in CI, which is why this is the only place the wiring can actually be proven.
      - name: Run the e2e suite
        run: npm run test:e2e
        env:
          E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}

      # `playwright.config.ts:24-26` emits traces and screenshots — useless without an upload.
      #
      # Deliberately ONLY `playwright-report/`, never `test-results/`. That is where the trace
      # files live, and the `setup` project's trace contains the password typed into the form
      # (`auth.setup.ts` calls `fill(password)`) along with the Supabase session cookies from
      # the response. GitHub's secret masking (`::add-mask::` above) applies to logs, NEVER to
      # artifact contents, and anyone with read access can download an artifact. To debug a red
      # CI run, reproduce it locally.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - if: always()
        run: supabase stop
